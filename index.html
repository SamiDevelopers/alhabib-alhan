<!doctype html>
<html lang="ar" dir="rtl" class="h-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>نظام تقييم مادة الألحان</title>
    
    <script src="sdk/element_sdk.js"></script>
    <script src="sdk/data_sdk.js"></script>
    
    <script src="https://cdn.tailwindcss.com/3.4.17"></script>
    <script src="https://cdn.jsdelivr.net/npm/lucide@0.263.0/dist/umd/lucide.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
    
    <link rel="stylesheet" href="style.css">
</head>
<body class="h-full overflow-auto">
    <div id="app" class="h-full w-full">
        <div id="loginScreen" class="h-full flex items-center justify-center p-4">
            <div class="max-w-md mx-auto w-full">
                <div class="grad-h rounded-2xl p-8 text-center mb-6">
                    <div class="text-6xl mb-3">⛪</div>
                    <h1 id="mainTitle" class="text-white text-2xl font-extrabold">نظام تقييم مادة الألحان والتسبحة</h1>
                    <p class="text-yellow-200 text-sm mt-2">لجنة التقييم - الإعداد الدراسي</p>
                    <p class="text-yellow-200 text-sm mt-2">امتحان السنة الثالثة - الترم الثاني 2026</p>
                </div>
                <div class="bg-white/90 rounded-2xl p-6 card-s">
                    <label class="block text-sm font-bold text-gray-700 mb-2">اختر اسمك (الخادم المقيّم)</label>
                    <select id="servantSelect" class="w-full mb-4 bg-white">
                        <option value="">-- اختر الخادم --</option>
                    </select>
                    <button onclick="loginServant()" class="w-full py-3 rounded-xl text-white font-bold text-lg grad-h hover-l">
                        دخول ←
                    </button>
                </div>
            </div>
        </div>

        <div id="mainApp" class="h-full hidden">
            <div class="grad-h p-4 flex items-center justify-between">
                <div class="flex items-center gap-3">
                    <div class="text-3xl">⛪</div>
                    <div>
                        <h1 id="appTitleHeader" class="text-white font-bold text-lg">نظام تقييم الألحان</h1>
                        <p id="servantNameDisplay" class="text-yellow-200 text-sm"></p>
                    </div>
                </div>
                <button onclick="logout()" class="bg-white/20 text-white px-4 py-2 rounded-xl text-sm font-bold hover-l">خروج</button>
            </div>

            <div class="flex gap-1 px-4 pt-4 bg-transparent">
                <button class="tab-btn active" onclick="switchTab('evaluate',this)">📝 التقييم</button>
                <button class="tab-btn" onclick="switchTab('results',this)">📊 الدرجات النهائية</button>
                <button class="tab-btn" onclick="switchTab('records',this)">📋 السجلات</button>
            </div>

            <div id="tab-evaluate" class="p-4">
                <div class="bg-white/90 rounded-2xl p-5 card-s mb-4">
                    <h2 class="font-bold text-lg mb-3" style="color:var(--primary)">🔍 بحث عن الدارس</h2>
                    <div class="flex gap-2 flex-wrap">
                        <input id="studentCodeInput" placeholder="كود الدارس" class="flex-1 min-w-[150px] bg-white">
                        <button onclick="searchStudent()" class="px-6 py-2 rounded-xl text-white font-bold grad-h hover-l">بحث</button>
                    </div>
                    <div class="mt-3">
                        <label class="text-sm font-bold text-gray-600">أو اختر الدارس:</label>
                        <select id="studentDropdown" class="w-full mt-1 bg-white" onchange="selectStudentFromDropdown()">
                            <option value="">-- اختر الدارس --</option>
                        </select>
                    </div>
                </div>

                <div id="studentInfoCard" class="hidden bg-white/90 rounded-2xl p-5 card-s mb-4">
                    <div class="flex items-center gap-4 mb-3">
                        <div id="studentInitialBox" class="w-14 h-14 rounded-full flex items-center justify-center text-2xl text-white font-bold" style="background:var(--info)">
                            <span id="studentInitial">د</span>
                        </div>
                        <div>
                            <h3 id="studentNameDisplay" class="font-bold text-lg" style="color:var(--primary)"></h3>
                            <span id="studentClassBadge" class="badge text-white" style="background:var(--info)"></span>
                        </div>
                    </div>
                    <div class="mt-4">
                        <label class="block text-sm font-bold text-gray-700 mb-2">🎵 اختر اللحن:</label>
                        <select id="hymnSelect" class="w-full bg-white" onchange="showCriteria()">
                            <option value="">-- اختر اللحن --</option>
                        </select>
                    </div>
                </div>

                <div id="criteriaCard" class="hidden bg-white/90 rounded-2xl p-5 card-s mb-4">
                    <h2 class="font-bold text-lg mb-4" style="color:var(--primary)">📋 معايير التقييم <span id="hymnNameCriteria" class="text-sm text-gray-500"></span></h2>
                    <div id="criteriaList" class="space-y-5"></div>
                    <div class="mt-5 p-4 rounded-xl" style="background:rgba(218,165,32,.1)">
                        <div class="flex justify-between items-center">
                            <span class="font-bold text-lg" style="color:var(--primary)">مجموع اللحن:</span>
                            <span id="hymnTotal" class="text-3xl font-extrabold" style="color:var(--gold)">0 / 10</span>
                        </div>
                    </div>
                    <button onclick="submitEvaluation()" id="submitBtn" class="w-full mt-4 py-3 rounded-xl text-white font-bold text-lg hover-l" style="background:var(--success)">✅ حفظ التقييم</button>
                    <div id="submitLoading" class="hidden w-full mt-4 py-3 rounded-xl text-white font-bold text-lg text-center" style="background:var(--success);opacity:.7">⏳ جاري الحفظ...</div>
                </div>
            </div>

            <div id="tab-results" class="p-4 hidden">
                <div class="bg-white/90 rounded-2xl p-5 card-s mb-4">
                    <h2 class="font-bold text-lg mb-3" style="color:var(--primary)">📊 الدرجات النهائية (من 30)</h2>
                    <div class="flex gap-2 flex-wrap mb-4">
                        <select id="filterClass" class="flex-1 min-w-[150px] bg-white" onchange="renderResults()"></select>
                        <button onclick="exportResults()" class="px-4 py-2 rounded-xl text-white font-bold text-sm hover-l" style="background:var(--info)">📥 تصدير CSV</button>
                    </div>
                    <div id="resultsContainer"></div>
                </div>
            </div>

            <div id="tab-records" class="p-4 hidden">
                <div class="bg-white/90 rounded-2xl p-5 card-s">
                    <h2 class="font-bold text-lg mb-3" style="color:var(--primary)">📋 سجل التقييمات</h2>
                    <select id="filterRecordClass" class="w-full mb-4 bg-white" onchange="renderRecords()"></select>
                    <div id="recordsContainer" class="space-y-3"></div>
                </div>
            </div>
        </div>

        <div id="confirmModal" class="modal-overlay hidden">
            <div class="bg-white rounded-2xl p-6 max-w-sm w-full mx-4 card-s">
                <h3 class="font-bold text-lg mb-2" style="color:var(--danger)">⚠️ تأكيد الحذف</h3>
                <p id="confirmMsg" class="text-gray-600 mb-4"></p>
                <div class="flex gap-3">
                    <button onclick="confirmDelete()" class="flex-1 py-2 rounded-xl text-white font-bold" style="background:var(--danger)">حذف</button>
                    <button onclick="closeConfirm()" class="flex-1 py-2 rounded-xl font-bold border-2" style="border-color:var(--primary);color:var(--primary)">إلغاء</button>
                </div>
            </div>
        </div>
        <div id="toast" class="toast hidden"></div>
    </div>

    <script src="script.js"></script>
</body>
</html>
