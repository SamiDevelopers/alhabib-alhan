html,body{height:100%;margin:0}

.tab-btn:not(.active){background:rgba(139,69,19,.1);color:#654321}

select,input{border:2px solid rgba(218,165,32,.3);border-radius:10px;padding:10px 14px;font-size:15px;outline:none;transition:border .3s}
select:focus,input:focus{border-color:#DAA520}
.toast{position:fixed;top:20px;left:50%;transform:translateX(-50%);z-index:9999;padding:12px 28px;border-radius:12px;color:#fff;font-weight:700;animation:slideDown .4s ease}
@keyframes slideDown{from{opacity:0;top:-20px}to{opacity:1;top:20px}}
.badge{display:inline-block;padding:2px 12px;border-radius:20px;font-size:12px;font-weight:700}
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:999;display:flex;align-items:center;justify-content:center}
.perf-bar{height:20px;border-radius:10px;transition:width .8s ease}

let currentServant = '';
let selectedStudent = null;
let allRecords = [];
let scores = {};
let deleteTarget = null;

// ======= INIT =======
const defaultConfig = {
  app_title: 'نظام تقييم مادة الألحان والتسبحة',
  background_color: '#FFF8DC',
  surface_color: '#FFFAF0',
  text_color: '#654321',

window.elementSdk.init({
  defaultConfig,
  onConfigChange: async (config) => {
    const t = config.app_title || defaultConfig.app_title;
    const el1 = document.getElementById('mainTitle');
    const el2 = document.getElementById('appTitleHeader');
    if(el1) el1.textContent = t;
    if(el2) el2.textContent = t;

    document.body.style.background = `linear-gradient(135deg, ${config.background_color || defaultConfig.background_color} 0%, #FAEBD7 100%)`;
    document.querySelectorAll('.card-s').forEach(el => el.style.background = config.surface_color || defaultConfig.surface_color);
    document.querySelectorAll('.grad-h').forEach(el => el.style.background = `linear-gradient(135deg, ${config.primary_action_color || defaultConfig.primary_action_color}, ${config.text_color || defaultConfig.text_color})`);
  },
  mapToCapabilities: (config) => ({
    recolorables: [
      {get:()=>config.background_color||defaultConfig.background_color, set:(v)=>{config.background_color=v;window.elementSdk.setConfig({background_color:v})}},
      {get:()=>config.surface_color||defaultConfig.surface_color, set:(v)=>{config.surface_color=v;window.elementSdk.setConfig({surface_color:v})}},
      {get:()=>config.text_color||defaultConfig.text_color, set:(v)=>{config.text_color=v;window.elementSdk.setConfig({text_color:v})}},
      {get:()=>config.primary_action_color||defaultConfig.primary_action_color, set:(v)=>{config.primary_action_color=v;window.elementSdk.setConfig({primary_action_color:v})}},
      {get:()=>config.secondary_action_color||defaultConfig.secondary_action_color, set:(v)=>{config.secondary_action_color=v;window.elementSdk.setConfig({secondary_action_color:v})}}
    ],
    borderables: [],
    fontEditable: undefined,
    fontSizeable: undefined
  }),
  mapToEditPanelValues: (config) => new Map([
    ['app_title', config.app_title || defaultConfig.app_title]

// Populate dropdowns
function populateServants(){
  const sel = document.getElementById('servantSelect');
  SERVANTS.forEach(s => {
    const o = document.createElement('option');
    o.value = s; o.textContent = s;
    sel.appendChild(o);
  });
}

function populateStudentDropdown(){
  const sel = document.getElementById('studentDropdown');
  sel.innerHTML = '<option value="">-- اختر الدارس --</option>';
  STUDENTS.forEach(s => {
    const o = document.createElement('option');
    o.value = s.code;
    o.textContent = `${s.code} - ${s.name} (${s.class})`;
    sel.appendChild(o);
  });
}

function populateClassFilters(){
  ['filterClass','filterRecordClass'].forEach(id => {
    const sel = document.getElementById(id);
    sel.innerHTML = '<option value="">كل الفصول</option>';
    CLASSES.forEach(c => {
      const o = document.createElement('option');
      o.value = c; o.textContent = c;
      sel.appendChild(o);
    });
  });
}

// ======= AUTH =======
function loginServant(){
  const v = document.getElementById('servantSelect').value;
  if(!v){showToast('اختر اسمك أولاً','var(--warning)');return}
  currentServant = v;
  document.getElementById('servantNameDisplay').textContent = '🧑‍🏫 ' + v;
  document.getElementById('loginScreen').classList.add('hidden');
  document.getElementById('mainApp').classList.remove('hidden');
  populateStudentDropdown();
  populateClassFilters();
  renderResults();
  renderRecords();
}

function logout(){
  currentServant = '';
  selectedStudent = null;
  document.getElementById('loginScreen').classList.remove('hidden');
  document.getElementById('mainApp').classList.add('hidden');
  resetEvaluation();
}

// ======= TABS =======
function switchTab(tab, btn){
  document.querySelectorAll('[id^="tab-"]').forEach(t=>t.classList.add('hidden'));
  document.getElementById('tab-'+tab).classList.remove('hidden');
  document.querySelectorAll('.tab-btn').forEach(b=>b.classList.remove('active'));
  btn.classList.add('active');
  if(tab==='results') renderResults();
  if(tab==='records') renderRecords();
}

// ======= STUDENT SEARCH =======
function searchStudent(){
  const code = document.getElementById('studentCodeInput').value.trim();
  const s = STUDENTS.find(st=>st.code===code);
  if(!s){showToast('لم يتم العثور على الدارس','var(--danger)');return}
  showStudent(s);
}

function selectStudentFromDropdown(){
  const code = document.getElementById('studentDropdown').value;
  if(!code) return;
  const s = STUDENTS.find(st=>st.code===code);
  if(s) showStudent(s);
}

function showStudent(s){
  selectedStudent = s;
  document.getElementById('studentNameDisplay').textContent = s.name;
  document.getElementById('studentClassBadge').textContent = s.class;
  document.getElementById('studentInitial').textContent = s.name.charAt(0);
  document.getElementById('studentInfoCard').classList.remove('hidden');

  // Populate hymns based on class
  const classHymns = HYMNS_BY_CLASS[s.class] || [];
  const sel = document.getElementById('hymnSelect');
  sel.innerHTML = '<option value="">-- اختر اللحن --</option>';
  classHymns.forEach(h => {
    const o = document.createElement('option');
    o.value = h; o.textContent = h;
    // Check if already evaluated by this servant
    const existing = allRecords.find(r => r.student_code===s.code && r.hymn_name===h && r.servant_name===currentServant);
    if(existing) o.textContent += ' ✅';
    sel.appendChild(o);
  });

  document.getElementById('criteriaCard').classList.add('hidden');
  scores = {};
}

// ======= CRITERIA =======
function showCriteria(){
  const hymn = document.getElementById('hymnSelect').value;
  if(!hymn){document.getElementById('criteriaCard').classList.add('hidden');return}
  document.getElementById('criteriaCard').classList.remove('hidden');
  document.getElementById('hymnNameCriteria').textContent = '(' + hymn + ')';

  // Check existing
  const existing = allRecords.find(r => r.student_code===selectedStudent.code && r.hymn_name===hymn && r.servant_name===currentServant);

  const container = document.getElementById('criteriaList');
  container.innerHTML = '';
  scores = {};

  CRITERIA.forEach(c => {
    const val = existing ? existing[c.key] : 0;
    scores[c.key] = val;

    const div = document.createElement('div');
    div.className = 'p-3 rounded-xl';
    div.style.background = 'rgba(218,165,32,.08)';
    div.innerHTML = `
      <div class="flex justify-between items-center mb-2">
        <span class="font-bold text-sm">${c.icon} ${c.label}</span>
        <span id="val-${c.key}" class="font-extrabold text-lg" style="color:var(--primary)">${val} / ${c.max}</span>
      </div>
      <input type="range" min="0" max="${c.max}" step="1" value="${val}" class="criteria-slider" oninput="updateScore('${c.key}',this.value,${c.max})">
      <div class="flex justify-between text-xs text-gray-400 mt-1"><span>0</span><span>${c.max}</span></div>
    `;
    container.appendChild(div);
  });

  updateTotal();

  // Show button state
  document.getElementById('submitBtn').classList.remove('hidden');
  document.getElementById('submitLoading').classList.add('hidden');
  if(existing){
    document.getElementById('submitBtn').textContent = '🔄 تحديث التقييم';
    document.getElementById('submitBtn').style.background = 'var(--warning)';
  } else {
    document.getElementById('submitBtn').textContent = '✅ حفظ التقييم';
    document.getElementById('submitBtn').style.background = 'var(--success)';
  }
}

function updateScore(key, val, max){
  scores[key] = parseInt(val);
  document.getElementById('val-'+key).textContent = val + ' / ' + max;
  updateTotal();
}

function updateTotal(){
  const t = Object.values(scores).reduce((a,b)=>a+b,0);
  document.getElementById('hymnTotal').textContent = t + ' / 10';
}

// ======= SUBMIT =======
async function submitEvaluation(){
  if(!selectedStudent || !document.getElementById('hymnSelect').value){
    showToast('اختر الدارس واللحن أولاً','var(--warning)');return;
  }

  const hymn = document.getElementById('hymnSelect').value;
  const total = Object.values(scores).reduce((a,b)=>a+b,0);

  // Check existing for update
  const existing = allRecords.find(r => r.student_code===selectedStudent.code && r.hymn_name===hymn && r.servant_name===currentServant);

  document.getElementById('submitBtn').classList.add('hidden');
  document.getElementById('submitLoading').classList.remove('hidden');

  let result;
  if(existing){
    const updated = {...existing, ...scores, total, created_at: new Date().toISOString()};
    result = await window.dataSdk.update(updated);
  } else {
    if(allRecords.length >= 999){
      showToast('تم الوصول للحد الأقصى (999 سجل)','var(--danger)');
      document.getElementById('submitBtn').classList.remove('hidden');
      document.getElementById('submitLoading').classList.add('hidden');
      return;
    }
    result = await window.dataSdk.create({
      student_code: selectedStudent.code,
      student_name: selectedStudent.name,
      class_name: selectedStudent.class,
      servant_name: currentServant,
      hymn_name: hymn,
      mastery: scores.mastery||0,
      vocal: scores.vocal||0,
      memorization: scores.memorization||0,
      spiritual: scores.spiritual||0,
      occasion: scores.occasion||0,
      total,
      created_at: new Date().toISOString()
    });
  }

  document.getElementById('submitBtn').classList.remove('hidden');
  document.getElementById('submitLoading').classList.add('hidden');

  if(result.isOk){
    showToast(existing?'تم تحديث التقييم ✅':'تم حفظ التقييم بنجاح ✅','var(--success)');
    // Refresh hymn list marks
    showStudent(selectedStudent);
  } else {
    showToast('حدث خطأ أثناء الحفظ ❌','var(--danger)');
  }
}

// ======= RESULTS =======
function renderResults(){
  const filterClass = document.getElementById('filterClass')?.value || '';
  const container = document.getElementById('resultsContainer');
  if(!container) return;

  // Group by student
  const studentMap = {};
  allRecords.forEach(r => {
    const key = r.student_code;
    if(!studentMap[key]) studentMap[key] = {code:r.student_code,name:r.student_name,class:r.class_name,evals:[]};
    studentMap[key].evals.push(r);
  });

  let students = Object.values(studentMap);
  if(filterClass) students = students.filter(s=>s.class===filterClass);

  if(!students.length){
    container.innerHTML = '<p class="text-center text-gray-400 py-8">لا توجد نتائج بعد</p>';
    return;
  }

  // Sort by class then name
  students.sort((a,b)=>CLASSES.indexOf(a.class)-CLASSES.indexOf(b.class) || a.name.localeCompare(b.name));

  let html = '';
  students.forEach(s => {
    // Group evals by hymn, then by servant
    const hymnMap = {};
    s.evals.forEach(e => {
      if(!hymnMap[e.hymn_name]) hymnMap[e.hymn_name] = [];
      hymnMap[e.hymn_name].push(e);
    });

    const hymnCount = Object.keys(hymnMap).length;
    let totalAvg = 0;

    const hymnRows = Object.entries(hymnMap).map(([hymn, evals]) => {
      // Average across servants for this hymn
      const avg = evals.reduce((a,e)=>a+e.total,0) / evals.length;
      totalAvg += avg;
      const servantNames = evals.map(e=>e.servant_name).join('، ');
      return `<div class="flex justify-between items-center py-1 border-b border-gray-100 text-sm">
        <span>🎵 ${hymn}</span>
        <span class="font-bold" style="color:var(--primary)">${avg.toFixed(1)} / 10 <span class="text-xs text-gray-400">(${servantNames})</span></span>
      </div>`;
    }).join('');

    // Final grade: average per hymn then scale to 30
    const avgPerHymn = hymnCount > 0 ? totalAvg / hymnCount : 0;
    const finalGrade = (avgPerHymn / 10) * 30;
    const pct = (finalGrade / 30) * 100;
    const color = pct >= 80 ? 'var(--success)' : pct >= 60 ? 'var(--warning)' : 'var(--danger)';
    const level = pct >= 90 ? 'ممتاز' : pct >= 80 ? 'جيد جداً' : pct >= 70 ? 'جيد' : pct >= 60 ? 'مقبول' : 'ضعيف';

    html += `
    <div class="mb-4 p-4 rounded-xl border-2" style="border-color:${color}20;background:${color}08">
      <div class="flex justify-between items-center mb-2">
        <div>
          <span class="font-bold" style="color:var(--primary)">${s.name}</span>
          <span class="badge text-white mr-2" style="background:var(--info)">${s.class}</span>
        </div>
        <div class="text-left">
          <div class="text-2xl font-extrabold" style="color:${color}">${finalGrade.toFixed(1)} / 30</div>
          <div class="text-xs font-bold" style="color:${color}">${level}</div>
        </div>
      </div>
      <div class="mb-2" style="background:#e5d5c0;border-radius:10px;overflow:hidden">
        <div class="perf-bar" style="width:${pct}%;background:${color}"></div>
      </div>
      <div class="text-xs text-gray-500 mb-1">عدد الألحان: ${hymnCount} | المتوسط لكل لحن: ${avgPerHymn.toFixed(1)} / 10</div>
      ${hymnRows}
    </div>`;
  });

  container.innerHTML = html;
}

// ======= RECORDS =======
function renderRecords(){
  const filterClass = document.getElementById('filterRecordClass')?.value || '';
  const container = document.getElementById('recordsContainer');
  if(!container) return;

  let records = [...allRecords];
  if(filterClass) records = records.filter(r=>r.class_name===filterClass);

  records.sort((a,b)=>new Date(b.created_at)-new Date(a.created_at));

  if(!records.length){
    container.innerHTML = '<p class="text-center text-gray-400 py-8">لا توجد سجلات</p>';
    return;
  }

  container.innerHTML = records.map(r => `
    <div class="p-3 rounded-xl bg-white border border-gray-100 flex justify-between items-center">
      <div>
        <span class="font-bold text-sm" style="color:var(--primary)">${r.student_name}</span>
        <span class="text-xs text-gray-400 mr-1">(${r.class_name})</span><br>
        <span class="text-sm">🎵 ${r.hymn_name}</span>
        <span class="text-xs text-gray-400 mr-1">• ${r.servant_name}</span>
        <span class="badge text-white text-xs mr-1" style="background:var(--gold)">${r.total}/10</span>
      </div>
      <button onclick="askDelete('${r.__backendId}')" class="text-xs px-3 py-1 rounded-lg text-white font-bold" style="background:var(--danger)">🗑</button>
    </div>
  `).join('');
}

// ======= DELETE =======
function askDelete(id){
  deleteTarget = id;
  document.getElementById('confirmMsg').textContent = 'هل تريد حذف هذا التقييم؟';
  document.getElementById('confirmModal').classList.remove('hidden');
}

function closeConfirm(){
  deleteTarget = null;
  document.getElementById('confirmModal').classList.add('hidden');
}

async function confirmDelete(){
  if(!deleteTarget){closeConfirm();return}
  const rec = allRecords.find(r=>r.__backendId===deleteTarget);
  if(!rec){closeConfirm();return}
  const result = await window.dataSdk.delete(rec);
  closeConfirm();
  if(result.isOk) showToast('تم الحذف ✅','var(--success)');
  else showToast('حدث خطأ ❌','var(--danger)');
}

// ======= EXPORT CSV =======
function exportResults(){
  const filterClass = document.getElementById('filterClass')?.value || '';
  const studentMap = {};
  allRecords.forEach(r => {
    if(filterClass && r.class_name!==filterClass) return;
    const key = r.student_code;
    if(!studentMap[key]) studentMap[key]={code:r.student_code,name:r.student_name,class:r.class_name,evals:[]};
    studentMap[key].evals.push(r);
  });

  let csv = '\uFEFF' + 'الكود,الاسم,الفصل,عدد الألحان,المتوسط من 10,الدرجة النهائية من 30,المستوى\n';

  Object.values(studentMap).forEach(s => {
    const hymnMap = {};
    s.evals.forEach(e => {
      if(!hymnMap[e.hymn_name]) hymnMap[e.hymn_name]=[];
      hymnMap[e.hymn_name].push(e);
    });
    const hymnCount = Object.keys(hymnMap).length;
    let totalAvg = 0;
    Object.values(hymnMap).forEach(evals => {
      totalAvg += evals.reduce((a,e)=>a+e.total,0)/evals.length;
    });
    const avgPerHymn = hymnCount>0?totalAvg/hymnCount:0;
    const finalGrade = (avgPerHymn/10)*30;
    const pct = (finalGrade/30)*100;
    const level = pct>=90?'ممتاز':pct>=80?'جيد جداً':pct>=70?'جيد':pct>=60?'مقبول':'ضعيف';
    csv += `${s.code},${s.name},${s.class},${hymnCount},${avgPerHymn.toFixed(1)},${finalGrade.toFixed(1)},${level}\n`;
  });

  const blob = new Blob([csv],{type:'text/csv;charset=utf-8;'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = 'نتائج_الألحان.csv';
  a.click();
  URL.revokeObjectURL(url);
}
