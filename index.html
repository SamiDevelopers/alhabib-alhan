// ========== FUNCTIONS ==========

function showToast(msg, type = 'success') {
  const c = document.getElementById('toastContainer');
  const t = document.createElement('div');
  t.className = `toast toast-${type}`;
  t.textContent = msg;
  c.appendChild(t);
  setTimeout(() => t.remove(), 3000);
}

function showConfirm(msg, onYes) {
  const c = document.getElementById('confirmContainer');
  c.innerHTML = `
    <div class="confirm-overlay" onclick="if(event.target===this)this.remove()">
      <div class="confirm-box">
        <p class="text-gray-200 mb-4 text-sm">${msg}</p>
        <div class="flex gap-3 justify-center">
          <button id="confirmYes" class="gold-bg text-gray-900 font-semibold px-6 py-2 rounded-xl text-sm">نعم</button>
          <button id="confirmNo" class="bg-gray-600 text-white px-6 py-2 rounded-xl text-sm">إلغاء</button>
        </div>
      </div>
    </div>`;
  document.getElementById('confirmYes').onclick = () => { c.innerHTML = ''; onYes(); };
  document.getElementById('confirmNo').onclick = () => { c.innerHTML = ''; };
}

function switchTab(tab) {
  ['Evaluate','Results','Final'].forEach(t => {
    const panel = document.getElementById('panel' + t);
    const btn = document.getElementById('tab' + t);
    if (t.toLowerCase() === tab.toLowerCase() || (tab === 'evaluate' && t === 'Evaluate') || (tab === 'results' && t === 'Results') || (tab === 'final' && t === 'Final')) {
      panel.classList.remove('hidden');
      btn.classList.add('active');
      btn.classList.remove('text-gray-400');
      btn.classList.add('text-yellow-200/80');
    } else {
      panel.classList.add('hidden');
      btn.classList.remove('active');
      btn.classList.remove('text-yellow-200/80');
      btn.classList.add('text-gray-400');
    }
  });
  if (tab === 'results') renderResults();
  if (tab === 'final') renderFinalGrades();
}

function lookupStudent() {
  const code = document.getElementById('inputCode').value.trim();
  if (!code) { showToast('اكتب كود الدارس', 'error'); return; }
  const s = STUDENTS.find(st => st.code === code);
  if (!s) { showToast('لم يتم العثور على الدارس', 'error'); document.getElementById('studentCard').classList.add('hidden'); document.getElementById('hymnSection').classList.add('hidden'); currentStudent = null; return; }

  currentStudent = s;
  document.getElementById('studentInitial').textContent = s.name[0];
  document.getElementById('studentNameDisplay').textContent = s.name;
  document.getElementById('studentClassDisplay').textContent = s.class;
  document.getElementById('studentCodeDisplay').textContent = 'كود: ' + s.code;
  document.getElementById('studentCard').classList.remove('hidden');

  // Populate hymns
  const selH = document.getElementById('selHymn');
  selH.innerHTML = '<option value="">— اختر اللحن —</option>';
  const hymnsForClass = HYMNS_BY_CLASS[s.class] || [];
  hymnsForClass.forEach(h => { const o = document.createElement('option'); o.value = h; o.textContent = h; selH.appendChild(o); });

  document.getElementById('hymnSection').classList.remove('hidden');
  document.getElementById('ratingSection').classList.add('hidden');
  updateHymnProgress();
  currentRatings = {};
}

function updateHymnProgress() {
  if (!currentStudent) return;
  const evaluator = document.getElementById('selEvaluator').value;
  if (!evaluator) return;
  const evaluated = allRecords.filter(r => r.student_code === currentStudent.code && r.evaluator_name === evaluator);
  const hymnCount = HYMNS_BY_CLASS[currentStudent.class]?.length || 7;
  const el = document.getElementById('hymnProgress');
  el.textContent = `تم تقييم ${evaluated.length} من ${hymnCount} ألحان`;
}

function onHymnSelected() {
  const hymn = document.getElementById('selHymn').value;
  if (!hymn) { document.getElementById('ratingSection').classList.add('hidden'); return; }

  currentRatings = {};
  CRITERIA.forEach(c => currentRatings[c.key] = 0);

  const container = document.getElementById('criteriaContainer');
  container.innerHTML = '';

  CRITERIA.forEach(cr => {
    const div = document.createElement('div');
    div.innerHTML = `
      <label class="block text-xs text-gray-400 mb-2">${cr.label}</label>
      <div class="flex gap-2 flex-wrap" id="rating_${cr.key}">
        ${[0, 0.5, 1, 1.5, 2].map(v => `<button type="button" class="rating-btn rounded-lg px-3 py-2 text-sm" data-key="${cr.key}" data-val="${v}" onclick="setRating('${cr.key}', ${v}, this)">${v}</button>`).join('')}
      </div>`;
    container.appendChild(div);
  });

  document.getElementById('ratingSection').classList.remove('hidden');
  updateHymnTotal();
}

function setRating(key, val, btn) {
  currentRatings[key] = val;
  const parent = btn.parentElement;
  parent.querySelectorAll('.rating-btn').forEach(b => {
    b.classList.toggle('active', parseFloat(b.dataset.val) === val);
  });
  updateHymnTotal();
}

function updateHymnTotal() {
  const total = Object.values(currentRatings).reduce((a, b) => a + b, 0);
  document.getElementById('hymnTotalDisplay').textContent = `${total} / 10`;
}

async function submitEvaluation() {
  if (isSubmitting) return;
  const evaluator = document.getElementById('selEvaluator').value;
  const hymn = document.getElementById('selHymn').value;

  if (!evaluator) { showToast('اختر الخادم المُقيِّم', 'error'); return; }
  if (!currentStudent) { showToast('ابحث عن الدارس أولاً', 'error'); return; }
  if (!hymn) { showToast('اختر اللحن', 'error'); return; }

  // Check if already evaluated
  const existing = allRecords.find(r => r.student_code === currentStudent.code && r.hymn_name === hymn && r.evaluator_name === evaluator);
  if (existing) {
    showConfirm('تم تقييم هذا اللحن مسبقاً. هل تريد تحديث التقييم؟', async () => {
      await doUpdate(existing);
    });
    return;
  }

  if (allRecords.length >= 999) { showToast('تم الوصول للحد الأقصى (999 سجل)', 'error'); return; }

  isSubmitting = true;
  const btn = document.getElementById('btnSubmit');
  btn.innerHTML = '<span class="spinner"></span> جاري الحفظ...';
  btn.disabled = true;

  const total = Object.values(currentRatings).reduce((a, b) => a + b, 0);
  const record = {
    student_code: currentStudent.code,
    student_name: currentStudent.name,
    student_class: currentStudent.class,
    hymn_name: hymn,
    evaluator_name: evaluator,
    melody_mastery: currentRatings.melody_mastery || 0,
    vocal_performance: currentRatings.vocal_performance || 0,
    memorization: currentRatings.memorization || 0,
    spiritual_understanding: currentRatings.spiritual_understanding || 0,
    occasion_knowledge: currentRatings.occasion_knowledge || 0,
    hymn_total: total,
    timestamp: new Date().toISOString()
  };

  const result = await window.dataSdk.create(record);
  isSubmitting = false;
  btn.innerHTML = '<i data-lucide="check-circle" style="width:18px;height:18px"></i> حفظ التقييم';
  btn.disabled = false;
  lucide.createIcons();

  if (result.isOk) {
    showToast('تم حفظ التقييم بنجاح ✓');
    document.getElementById('selHymn').value = '';
    document.getElementById('ratingSection').classList.add('hidden');
  } else {
    showToast('حدث خطأ أثناء الحفظ', 'error');
  }
}

async function doUpdate(existing) {
  isSubmitting = true;
  const btn = document.getElementById('btnSubmit');
  btn.innerHTML = '<span class="spinner"></span> جاري التحديث...';
  btn.disabled = true;

  const total = Object.values(currentRatings).reduce((a, b) => a + b, 0);
  const updated = { ...existing,
    melody_mastery: currentRatings.melody_mastery || 0,
    vocal_performance: currentRatings.vocal_performance || 0,
    memorization: currentRatings.memorization || 0,
    spiritual_understanding: currentRatings.spiritual_understanding || 0,
    occasion_knowledge: currentRatings.occasion_knowledge || 0,
    hymn_total: total,
    timestamp: new Date().toISOString()
  };

  const result = await window.dataSdk.update(updated);
  isSubmitting = false;
  btn.innerHTML = '<i data-lucide="check-circle" style="width:18px;height:18px"></i> حفظ التقييم';
  btn.disabled = false;
  lucide.createIcons();

  if (result.isOk) {
    showToast('تم تحديث التقييم ✓');
    document.getElementById('selHymn').value = '';
    document.getElementById('ratingSection').classList.add('hidden');
  } else {
    showToast('حدث خطأ أثناء التحديث', 'error');
  }
}

function renderResults() {

    container.innerHTML = '<p class="text-center text-gray-500 py-8">لا توجد نتائج</p>';
    return;
  }

  let html = `<table class="w-full text-xs">
    <thead><tr class="text-yellow-200/60 border-b border-white/10">
      <th class="py-2 px-2 text-right">الدارس</th>
      <th class="py-2 px-2 text-right">الفصل</th>
      <th class="py-2 px-2 text-right">اللحن</th>
      <th class="py-2 px-2 text-right">الخادم</th>
      <th class="py-2 px-2 text-center">إتقان</th>
      <th class="py-2 px-2 text-center">أداء</th>
      <th class="py-2 px-2 text-center">حفظ</th>
      <th class="py-2 px-2 text-center">فهم</th>
      <th class="py-2 px-2 text-center">مناسبة</th>
      <th class="py-2 px-2 text-center">المجموع</th>
    </tr></thead><tbody>`;

      <td class="py-2 px-2">${r.student_class}</td>
      <td class="py-2 px-2">${r.hymn_name}</td>
      <td class="py-2 px-2">${r.evaluator_name}</td>
      <td class="py-2 px-2 text-center">${r.melody_mastery}</td>
      <td class="py-2 px-2 text-center">${r.vocal_performance}</td>
      <td class="py-2 px-2 text-center">${r.memorization}</td>
      <td class="py-2 px-2 text-center">${r.spiritual_understanding}</td>
      <td class="py-2 px-2 text-center">${r.occasion_knowledge}</td>
      <td class="py-2 px-2 text-center font-bold text-yellow-200">${r.hymn_total}/10</td>
    </tr>`;
  });

  html += '</tbody></table>';
  container.innerHTML = html;
}

function renderFinalGrades() {
  const classFilter = document.getElementById('filterFinalClass').value;
  const container = document.getElementById('finalTable');

  // Group by student
  const studentMap = {};
  allRecords.forEach(r => {
    const key = r.student_code;
    if (!studentMap[key]) studentMap[key] = { name: r.student_name, class: r.student_class, code: r.student_code, evaluations: {} };
    // Group by hymn then evaluator
    if (!studentMap[key].evaluations[r.hymn_name]) studentMap[key].evaluations[r.hymn_name] = {};
    studentMap[key].evaluations[r.hymn_name][r.evaluator_name] = r.hymn_total;
  });

  let students = Object.values(studentMap);
  if (classFilter) students = students.filter(s => s.class === classFilter);

  if (students.length === 0) {
    container.innerHTML = '<p class="text-center text-gray-500 py-8">لا توجد نتائج نهائية</p>';
    return;
  }

  let html = `<table class="w-full text-xs">
    <thead><tr class="text-yellow-200/60 border-b border-white/10">
      <th class="py-2 px-2 text-right">الدارس</th>
      <th class="py-2 px-2 text-right">الفصل</th>
      <th class="py-2 px-2 text-center">عدد الألحان</th>
      <th class="py-2 px-2 text-center">متوسط الخادمين</th>
      <th class="py-2 px-2 text-center">الدرجة النهائية /30</th>
    </tr></thead><tbody>`;

  students.forEach(s => {
    const hymnCount = HYMNS_BY_CLASS[s.class]?.length || 7;
    const hymns = Object.keys(s.evaluations);
    let totalScore = 0;
    let evaluatedCount = 0;

    hymns.forEach(h => {
      const evals = Object.values(s.evaluations[h]);
      if (evals.length > 0) {
        const avg = evals.reduce((a, b) => a + b, 0) / evals.length;
        totalScore += avg;
        evaluatedCount++;
      }
    });

    // Calculate final grade: (average of all hymn scores / 10) × 30
    const finalGrade = evaluatedCount > 0 ? ((totalScore / evaluatedCount / 10) * 30).toFixed(1) : '0';
    const pct = evaluatedCount > 0 ? ((parseFloat(finalGrade) / 30) * 100) : 0;
    const barColor = pct >= 70 ? '#22c55e' : pct >= 50 ? '#eab308' : '#ef4444';

    html += `<tr class="border-b border-white/5 hover:bg-white/5">
      <td class="py-3 px-2 font-semibold">${s.name}</td>
      <td class="py-3 px-2">${s.class}</td>
      <td class="py-3 px-2 text-center">${evaluatedCount}/${hymnCount}</td>
      <td class="py-3 px-2 text-center">${evaluatedCount > 0 ? (totalScore / evaluatedCount).toFixed(1) : '—'}/10</td>
      <td class="py-3 px-2">
        <div class="flex items-center gap-2 justify-center">
          <div class="w-16 h-2 rounded-full bg-white/10 overflow-hidden">
            <div class="h-full rounded-full" style="width:${pct}%;background:${barColor}"></div>
          </div>
          <span class="font-bold text-yellow-200">${finalGrade}</span>
        </div>
      </td>
    </tr>`;
  });

  html += '</tbody></table>';
  container.innerHTML = html;
